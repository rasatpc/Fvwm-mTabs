# FvwmTabs v12-stable configuration

#theme=white
theme=black

# verbose=true includes normal runtime flow messages.
# debug=true includes detailed retry/protocol messages and implies logging.
logging=false
verbose=false
debug=false

# Recommended: match the Class part of WM_CLASS.
# Format: autoSwallowClass=ClassPattern TABBER_ID, AnotherClass TABBER_ID
# The target tabber ID must already exist; autoSwallow does not create tabbers.
# xterm usually has class XTerm; xfce4-terminal has class Xfce4-terminal.
autoSwallowClass=firefox 1, Chromium 1, thunderbird* 2

# Compatibility rule types. Prefer autoSwallowClass when possible.
# autoSwallowResource matches the first WM_CLASS string, also called instance/resource.
# autoSwallowName matches _NET_WM_NAME or WM_NAME.
autoSwallowResource=evolution 2, gimp 3
# autoSwallowName=*Images* 2

# If an autoSwallow window appears and its assigned tabber does not yet exist,
# automatically create the tabber before routing the window into it.
# Default: false — window is silently ignored until the user creates the tabber.
autoCreateAssignedTabber=true
