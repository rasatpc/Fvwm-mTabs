# FvwmTabs configuration

# ===========================================================================
#  FOCUS MODEL
# ===========================================================================
# Focus model for the FvwmTabs tabber frame. FVWM's default is SloppyFocus,
# and FvwmTabs follows that default when this line is removed.
#
#   focus=sloppy   -> FVWM's default focus policy applies. [default]
#   focus=click    -> FvwmTabs sends `Style "FvwmTabs" ClickToFocus` to FVWM
#                     during startup, asking FVWM not to give focus to the
#                     tabber frame via its focus policy.
#

focus=sloppy

# ===========================================================================
#  THEME
# ===========================================================================
# Active theme: black or white
#   black = dark background, light text (default)
#   white = light background, dark text
# If this line is removed, FvwmTabs defaults to black.

theme=black

# ---------------------------------------------------------------------------
#  Colour customisation (optional)
# ---------------------------------------------------------------------------
# Every colour of both themes is editable here, using:
#
#     <theme>.<element>=<colour>
#
# <theme>   is black or white
# <colour>  is an X11 colour name (e.g. red, gray20) or a hex value (#1a1a1a).
#
# The active values for both themes are listed below. These lines ARE the
# colours it uses. Edit any value to recolour a theme.
# If you delete or comment out a line, that single colour
# falls back to a neutral default (#222222). (The "#" in a hex colour is part
# of the value — only a leading "#", or a "#" after a space, starts a comment.)
#
#   element                  meaning
#   tabbar_bg                tab-bar background
#   content_bg               swallowed-window / content background
#   button_bg                tab button background
#   button_fg                tab button text
#   button_active_bg         hovered tab background
#   button_active_fg         hovered tab text
#   button_selected_bg       selected tab background
#   button_selected_fg       selected tab text
#   button_selected_border   selected tab underline / border
#   close_fg                 tab close "x" colour
#   menu_bg                  right-click menu background
#   menu_fg                  right-click menu text
#   menu_active_bg           highlighted menu item background
#   menu_active_fg           highlighted menu item text

# --- black theme ---
black.tabbar_bg=#222222
black.content_bg=#111111
black.button_bg=#222222
black.button_fg=#eeeeee
black.button_active_bg=#001654
black.button_active_fg=#ffffff
black.button_selected_bg=#001654
black.button_selected_fg=#ffffff
black.button_selected_border=#7aa7ff
black.close_fg=#bbbbbb
black.menu_bg=#202020
black.menu_fg=#f0f0f0
black.menu_active_bg=#4a4a4a
black.menu_active_fg=#ffffff

# --- white theme ---
white.tabbar_bg=#e8e8e8
white.content_bg=#f7f7f7
white.button_bg=#ffffff
white.button_fg=#111111
white.button_active_bg=#dcdcdc
white.button_active_fg=#000000
white.button_selected_bg=#d9eaff
white.button_selected_fg=#000000
white.button_selected_border=#2f6fbd
white.close_fg=#444444
white.menu_bg=#ffffff
white.menu_fg=#111111
white.menu_active_bg=#d9d9d9
white.menu_active_fg=#000000

## Match the Class part of WM_CLASS.
## Format: autoSwallowClass=ClassPattern TABBER_ID, AnotherClass TABBER_ID
autoSwallowClass=firefox 1, Chromium 1, thunderbird* 2

## autoSwallowResource matches the first WM_CLASS string, also called
## instance/resource.
autoSwallowResource=evolution 2, Telegram 1

## autoSwallowName matches _NET_WM_NAME or WM_NAME.
autoSwallowName=*Image* 3

## If an autoSwallow window appears and its assigned tabber does not yet exist,
## it automatically creates the tabber before routing the window into it.
## Default: false — window is silently ignored until the user creates the tabber.
autoCreateAssignedTabber=true

## Optional root-window menu binding (comment out if you already use a right-click root menu).

Mouse 3 R A Menu TabbersMenu mouse 0p 0p
